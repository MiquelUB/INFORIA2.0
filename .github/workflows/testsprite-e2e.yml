name: TestSprite E2E Tests

on:
  push:
    branches: [main, login-correcto, feature/testsprite-improvements]
  pull_request:
    branches: [main, login-correcto]
  schedule:
    - cron: "0 2 * * *" # Daily at 2 AM

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inforia_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: 🎭 Install Playwright browsers
        run: playwright install chromium

      - name: 🚀 Start development server
        run: |
          npm install
          npm run build
          npm start &
          sleep 10
        env:
          NODE_ENV: test

      - name: ⏱️ Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Server is ready"
              exit 0
            fi
            echo "⏳ Waiting for server... ($i/30)"
            sleep 2
          done
          echo "❌ Server failed to start"
          exit 1

      - name: 🧪 Run TestSprite tests (Audit Blindado)
        run: |
          # Ejecutar tests críticos refactorizados
          python testsprite_tests/TC001_User_sign_up_and_login_with_Supabase_authentication.py
          python testsprite_tests/TC007_Billing_system_subscription_plans_payments_and_Stripe_integration.py
          python testsprite_tests/TC004_AI_powered_clinical_report_generation_with_voice_transcription_and_text_input.py
        env:
          BASE_URL: "http://localhost:3000"
          HEADLESS: "true"

      - name: 📊 Generate audit report
        if: always()
        run: python audit_testsprite.py

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            audit_report.json
            AUDITORIA_TESTSPRITE_COMPLETA.md

      - name: 📸 Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/screenshots/

      - name: 📹 Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-results/videos/

      - name: 💬 Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('audit_report.json', 'utf8'));
            const comment = `## 🧪 TestSprite E2E Results

            ✅ **Total Tests:** ${results.total_tests}
            📊 **Coverage:** See attached artifacts

            [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: 🎯 Check test results
        if: failure()
        run: |
          echo "❌ Some tests failed. Review the artifacts above."
          exit 1
